name: Verify WebUI

on:
  push:

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'NanmiCoder/dsh-plugin-market'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install pinned toolchain
        run: npm install --global pnpm@10.33.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify plugin package
        run: |
          pnpm build
          pnpm verify
          pnpm site:build

# Deployment is handled by Vercel's native GitHub integration: every push to
# main builds and ships production automatically (Project Settings → Git).
# No tokens or secrets are needed here.
