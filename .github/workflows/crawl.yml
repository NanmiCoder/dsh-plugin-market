name: crawl

on:
  schedule:
    # Every two hours, at :17 to stay off the top-of-hour rush.
    - cron: '17 */2 * * *'
  workflow_dispatch:
    inputs:
      noLlm:
        description: 'Skip labelling (rules only)'
        type: boolean
        default: false
      force:
        description: 'Bypass the labelling budget cap'
        type: boolean
        default: false
      dryRun:
        description: 'Write to .tmp/ and do not commit'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  # Never cancel in flight: a cancelled run can leave data/ half written.
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run the pipeline
        id: run
        env:
          # The built-in token is enough: discovery reads public data only.
          # Set GH_PAT_READONLY to raise the hourly GraphQL ceiling.
          GITHUB_TOKEN: ${{ secrets.GH_PAT_READONLY || github.token }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          node tools/crawler/cli.ts \
            ${{ inputs.noLlm && '--no-llm' || '' }} \
            ${{ inputs.force && '--force' || '' }} \
            ${{ inputs.dryRun && '--dry-run' || '' }} \
            | tee run.log
          # The crawler prints this marker only when contentHash changed.
          if grep -q '::set-output-changed::true' run.log; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify the published catalog
        if: steps.run.outputs.changed == 'true' && !inputs.dryRun
        run: node scripts/verify.mjs

      - name: Commit refreshed data
        if: steps.run.outputs.changed == 'true' && !inputs.dryRun
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          # Second guard: contentHash said something changed, but if the tree is
          # identical there is nothing to record.
          if git diff --cached --quiet; then
            echo 'tree unchanged despite a new contentHash; nothing to commit'
            exit 0
          fi
          git commit -m "data: refresh catalog [skip ci]"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep $((attempt * 5))
          done
          exit 1

      - name: Report a failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label crawl-failure --state open --json number -q '.[0].number')
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title 'crawl workflow failing' --label crawl-failure --body "$body"
          fi

      - name: Close the failure issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for number in $(gh issue list --label crawl-failure --state open --json number -q '.[].number'); do
            gh issue close "$number" --comment 'Recovered.'
          done
